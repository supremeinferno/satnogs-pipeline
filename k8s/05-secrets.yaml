# Development values, the same dummy passwords as docker-compose.yml. A real
# cluster would get these from a secret manager, not from a file in git.
apiVersion: v1
kind: Secret
metadata:
  name: pipeline
  namespace: satnogs
type: Opaque
stringData:
  POSTGRES_PASSWORD: satnogs
  RABBITMQ_DEFAULT_USER: satnogs
  RABBITMQ_DEFAULT_PASS: satnogs
  # Inside the cluster a Service is reachable by its name (postgres, rabbitmq).
  DATABASE_URL: postgres://satnogs:satnogs@postgres:5432/satnogs
  AMQP_URL: amqp://satnogs:satnogs@rabbitmq:5672/
