# fetch and store are Deployments: interchangeable pods, so replicas can be
# changed freely. Nothing says "start after RabbitMQ is ready": Kubernetes
# starts everything at once, and the programs retry until their dependencies
# answer. That is what the reconnect code is for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetch
  namespace: satnogs
spec:
  replicas: 1 # one fetcher is enough; a second would only repeat the first
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: fetch}
  template:
    metadata:
      labels: {app: fetch}
    spec:
      containers:
        - name: fetch
          image: satnogs-pipeline:dev
          args: ["fetch", "-interval", "5m"]
          env:
            - name: AMQP_URL
              valueFrom: {secretKeyRef: {name: pipeline, key: AMQP_URL}}
          ports:
            - {name: metrics, containerPort: 9100}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: satnogs
spec:
  replicas: 2 # competing consumers: RabbitMQ shares the queue between them
  selector:
    matchLabels: {app: store}
  template:
    metadata:
      labels: {app: store}
    spec:
      containers:
        - name: store
          image: satnogs-pipeline:dev
          args: ["store"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: pipeline, key: DATABASE_URL}}
            - name: AMQP_URL
              valueFrom: {secretKeyRef: {name: pipeline, key: AMQP_URL}}
          ports:
            - {name: metrics, containerPort: 9100}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
# Reads raw radio frames from the SatNOGS DB API; needs the account token,
# which deploy.sh puts in the satnogs-db secret from .env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetch-telemetry
  namespace: satnogs
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: fetch-telemetry}
  template:
    metadata:
      labels: {app: fetch-telemetry}
    spec:
      containers:
        - name: fetch-telemetry
          image: satnogs-pipeline:dev
          args: ["fetch-telemetry", "-interval", "5m"]
          env:
            - name: AMQP_URL
              valueFrom: {secretKeyRef: {name: pipeline, key: AMQP_URL}}
            - name: SATNOGS_DB_TOKEN
              valueFrom: {secretKeyRef: {name: satnogs-db, key: token}}
          ports:
            - {name: metrics, containerPort: 9100}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
# Battery rules with eclipse context. Reads Postgres, fetches the TLE from
# CelesTrak, and exports the result as metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watch
  namespace: satnogs
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: watch}
  template:
    metadata:
      labels: {app: watch}
    spec:
      containers:
        - name: watch
          image: satnogs-pipeline:dev
          args: ["watch", "-interval", "1m"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: pipeline, key: DATABASE_URL}}
          ports:
            - {name: metrics, containerPort: 9100}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
# One Service per program, named as in docker-compose.yml, so that the same
# monitoring/prometheus.yml (fetch:9100, store:9100, ...) works in both.
apiVersion: v1
kind: Service
metadata: {name: fetch, namespace: satnogs}
spec:
  selector: {app: fetch}
  ports: [{name: metrics, port: 9100}]
---
apiVersion: v1
kind: Service
metadata: {name: fetch-telemetry, namespace: satnogs}
spec:
  selector: {app: fetch-telemetry}
  ports: [{name: metrics, port: 9100}]
---
apiVersion: v1
kind: Service
metadata: {name: store, namespace: satnogs}
spec:
  selector: {app: store}
  ports: [{name: metrics, port: 9100}]
---
apiVersion: v1
kind: Service
metadata: {name: watch, namespace: satnogs}
spec:
  selector: {app: watch}
  ports: [{name: metrics, port: 9100}]
