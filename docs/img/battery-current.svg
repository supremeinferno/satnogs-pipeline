<text class="muted" x="64" y="52" font-size="13">137 beacons heard by SatNOGS ground stations over 5.1 days, 17 Oct to 22 Oct UTC.</text>
<text class="muted" x="64" y="70" font-size="13">Lighting at each beacon comes from SGP4 and the Sun's position, not from the battery.</text>
