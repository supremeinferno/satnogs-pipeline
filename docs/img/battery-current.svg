<title id="t">UWE-4 battery A current, by lighting</title>
<desc id="d">137 beacons over 5.1 days. Of 60 in the Earth's shadow, 0 were charging and 37 discharging. Of 77 in sunlight, 61 were charging and 8 discharging.</desc>
