services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: satnogs
      POSTGRES_PASSWORD: satnogs
      POSTGRES_DB: satnogs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
