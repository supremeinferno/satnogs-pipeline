services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: satnogs
      POSTGRES_PASSWORD: satnogs
      POSTGRES_DB: satnogs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "satnogs"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: satnogs
      RABBITMQ_DEFAULT_PASS: satnogs
    ports:
      - "5672:5672"   # AMQP, what the program talks to
      - "15672:15672" # management UI: http://localhost:15672
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Inside the compose network, services reach each other by service name
  # (postgres, rabbitmq), not localhost.
  fetch:
    build: .
    command: ["fetch", "-interval", "5m"]
    environment:
      AMQP_URL: amqp://satnogs:satnogs@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  store:
    build: .
    command: ["store"]
    environment:
      DATABASE_URL: postgres://satnogs:satnogs@postgres:5432/satnogs
      AMQP_URL: amqp://satnogs:satnogs@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:
