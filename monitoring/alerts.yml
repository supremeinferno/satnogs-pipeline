groups:
  - name: pipeline
    rules:
      # A stopped program has no metrics at all, so "time since last poll"
      # can't see it: up == 0 (Prometheus couldn't scrape it) catches that.
      - alert: ServiceDown
        expr: up{job=~"fetch|fetch-telemetry|store|watch"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is down (cannot be scraped)"

      - alert: PollStale
        expr: time() - pipeline_last_poll_success_timestamp_seconds{job=~"fetch|fetch-telemetry"} > 900
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "No successful SatNOGS poll for {{ $value | humanizeDuration }} (interval is 5m)"

      - alert: APIErrors
        expr: increase(pipeline_api_requests_total{outcome="error"}[10m]) > 3
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} SatNOGS API errors in 10 minutes"

      - alert: QueueBacklog
        expr: rabbitmq_queue_messages_ready{queue=~"observations|telemetry"} > 100
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} messages waiting in {{ $labels.queue }}; store is slow or stopped"

      - alert: DeadQueueNotEmpty
        expr: rabbitmq_queue_messages_ready{queue=~".+\\.dead"} > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} message(s) in {{ $labels.queue }}; they can never be stored and need a look"

      - alert: StoreFailing
        expr: increase(pipeline_stored_total{result="failed"}[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "store failed to write {{ $value | printf \"%.0f\" }} message(s) in 5 minutes (database down?)"

  - name: battery
    rules:
      # The persistence (three readings, 30 minutes apart, all in sunlight) is
      # in the watch program, so this fires as soon as the metric is 1.
      - alert: BatteryDischargingInSunlight
        expr: pipeline_battery_anomaly{rule="discharging_in_sunlight"} == 1
        labels: {severity: warning}
        annotations:
          summary: "Battery {{ $labels.battery }} is discharging in sunlight (3 readings over 30+ minutes, current below -50 mA)"

      - alert: BatteryVoltageLow
        expr: pipeline_battery_anomaly{rule="low_voltage"} == 1
        labels: {severity: critical}
        annotations:
          summary: "Battery {{ $labels.battery }} voltage is below 3500 mV (the lowest seen in 3 days was 3732 mV)"

      - alert: TelemetryStale
        expr: pipeline_telemetry_age_seconds > 12 * 3600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "No UWE-4 beacon stored for {{ $value | humanizeDuration }} (largest gap seen in 3 days: 7.7 hours)"

      - alert: TLEStale
        expr: pipeline_tle_age_seconds > 10 * 86400
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The orbit data is {{ $value | humanizeDuration }} old; sunlight can no longer be trusted, so the sunlight rule is off"
