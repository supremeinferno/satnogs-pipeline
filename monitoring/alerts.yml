groups:
  - name: pipeline
    rules:
      # A stopped program has no metrics at all, so "time since last poll"
      # can't see it: up == 0 (Prometheus couldn't scrape it) catches that.
      - alert: ServiceDown
        expr: up{job=~"fetch|fetch-telemetry|store|watch"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is down (cannot be scraped)"

      - alert: PollStale
        expr: time() - pipeline_last_poll_success_timestamp_seconds{job=~"fetch|fetch-telemetry"} > 900
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "No successful SatNOGS poll for {{ $value | humanizeDuration }} (interval is 5m)"

      - alert: APIErrors
        expr: increase(pipeline_api_requests_total{outcome="error"}[10m]) > 3
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} SatNOGS API errors in 10 minutes"

      - alert: QueueBacklog
        expr: rabbitmq_queue_messages_ready{queue=~"observations|telemetry"} > 100
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} messages waiting in {{ $labels.queue }}; store is slow or stopped"

      - alert: DeadQueueNotEmpty
        expr: rabbitmq_queue_messages_ready{queue=~".+\\.dead"} > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} message(s) in {{ $labels.queue }}; they can never be stored and need a look"

      - alert: StoreFailing
        expr: increase(pipeline_stored_total{result="failed"}[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "store failed to write {{ $value | printf \"%.0f\" }} message(s) in 5 minutes (database down?)"

  - name: battery
    rules:
      # The persistence (three readings, 30 minutes apart, all in sunlight) is
      # in the watch program, so these fire as soon as the metric is 1.
      - alert: BatteryDischargingInSunlight
        expr: pipeline_battery_anomaly{rule="discharging_in_sunlight"} == 1
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.satellite }}: battery {{ $labels.battery }} is discharging in sunlight (3 readings over 30+ minutes, current below -50 mA)"

      - alert: BatteryVoltageBelowBaseline
        expr: pipeline_battery_anomaly{rule="voltage_below_baseline"} == 1
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.satellite }}: battery {{ $labels.battery }} voltage in sunlight is clearly below its own usual (the median of at least 40 earlier sunlit beacons over 3+ days)"

      - alert: BatteryVoltageLow
        expr: pipeline_battery_anomaly{rule="low_voltage"} == 1
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.satellite }}: battery {{ $labels.battery }} voltage is below its limit"

      # Each satellite is heard at its own rate; watch exports how long a
      # silence is worth an alert (UWE-4: 12 hours, its largest gap in 5 days was 7.7).
      - alert: TelemetryStale
        expr: pipeline_telemetry_age_seconds > on(satellite) pipeline_telemetry_stale_after_seconds
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "No {{ $labels.satellite }} beacon stored for {{ $value | humanizeDuration }}"

      - alert: TLEStale
        expr: pipeline_tle_age_seconds > 10 * 86400
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.satellite }}: the orbit data is {{ $value | humanizeDuration }} old; sunlight can no longer be trusted, so the rules that need it are off"
