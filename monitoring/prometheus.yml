global:
  scrape_interval: 5s

scrape_configs:
  - job_name: fetch
    static_configs: [{targets: ["fetch:9100"]}]
  - job_name: store
    static_configs: [{targets: ["store:9100"]}]
  # RabbitMQ's own metrics; the plugin ships in the image. The default path
  # only gives totals; per-object adds the queue label (queue depth per queue).
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs: [{targets: ["rabbitmq:15692"]}]
